apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: kubewatch-app-monitor
  namespace: kubewatch
  labels:
    app: kubewatch-app
    release: monitoring
spec:
  selector:
    matchLabels:
      app: kubewatch-app
  namespaceSelector:
    matchNames:
      - kubewatch
  endpoints:
    - port: http
      path: /actuator/prometheus
      interval: "15s"
      scrapeTimeout: "10s"
