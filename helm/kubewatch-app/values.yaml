# KubeWatch App Helm Values
replicaCount: 2

image:
  repository: kubewatch-app
  tag: "1.0.0"
  pullPolicy: Never

service:
  type: ClusterIP
  port: 8080

resources:
  requests:
    cpu: "100m"
    memory: "256Mi"
  limits:
    cpu: "500m"
    memory: "512Mi"

autoscaling:
  enabled: true
  minReplicas: 2
  maxReplicas: 5
  targetCPUUtilizationPercentage: 70
  targetMemoryUtilizationPercentage: 80

probes:
  startup:
    initialDelaySeconds: 15
    periodSeconds: 5
    failureThreshold: 10
  readiness:
    initialDelaySeconds: 5
    periodSeconds: 10
    failureThreshold: 3
  liveness:
    initialDelaySeconds: 30
    periodSeconds: 15
    failureThreshold: 3

serviceMonitor:
  enabled: true
  interval: "15s"
  scrapeTimeout: "10s"

namespace: kubewatch
